<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <script>window._trackJs = { token: "42d525d853e74150a3444487ac406636", application: "lab9-error-handling" };</script>
  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    class CalculatorError extends Error {
      constructor(message) {
        super(message);
        this.name = 'CalculatorError';
      }
    }

    class InvalidInputError extends CalculatorError {
      constructor(message, field) {
        super(message);
        this.name = 'InvalidInputError';
        this.field = field;
      }
    }

    class DivisionByZeroError extends CalculatorError {
      constructor(message = 'Cannot divide by zero') {
        super(message);
        this.name = 'DivisionByZeroError';
      }
    }

    window.addEventListener('error', (e) => {
      console.log('[Global error handler] caught an error:', e.message, 'at', e.filename + ':' + e.lineno);
    });

    window.onerror = function (message, source, lineno, colno, error) {
      console.log('[window.onerror] ' + message + ' (' + source + ':' + lineno + ':' + colno + ')');
      return false;
    };

    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;

      try {
        if (firstNum.trim() === '' || isNaN(Number(firstNum))) {
          throw new InvalidInputError('First number is not a valid number', 'first-num');
        }
        if (secondNum.trim() === '' || isNaN(Number(secondNum))) {
          throw new InvalidInputError('Second number is not a valid number', 'second-num');
        }
        if (operator === '/' && Number(secondNum) === 0) {
          throw new DivisionByZeroError();
        }

        const result = eval(`${firstNum} ${operator} ${secondNum}`);
        if (!Number.isFinite(result)) {
          throw new CalculatorError('Result is not a finite number');
        }
        output.innerHTML = result;
      } catch (err) {
        if (err instanceof InvalidInputError) {
          output.innerHTML = `Input error (${err.field}): ${err.message}`;
          console.error(err);
        } else if (err instanceof DivisionByZeroError) {
          output.innerHTML = 'Error: ' + err.message;
          console.error(err);
        } else if (err instanceof CalculatorError) {
          output.innerHTML = 'Calculator error: ' + err.message;
          console.error(err);
        } else {
          output.innerHTML = 'Unexpected error: ' + err.message;
          console.error('Unknown error from calculator:', err);
        }
      } finally {
        console.log('Calculation attempt finished at', new Date().toISOString());
      }
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    errorBtns[0].addEventListener('click', () => {
      const user = { name: 'Ada Lovelace', role: 'mathematician' };
      console.log('Console Log demo — user object:', user);
    });

    errorBtns[1].addEventListener('click', () => {
      console.error('Console Error demo — something went wrong while loading user profile');
    });

    errorBtns[2].addEventListener('click', () => {
      console.count('button-clicked');
    });

    errorBtns[3].addEventListener('click', () => {
      console.warn('Console Warn demo — deprecated API usage detected');
    });

    errorBtns[4].addEventListener('click', () => {
      const value = 5;
      console.assert(value > 10, 'Console Assert demo — value should be greater than 10, but was', value);
    });

    errorBtns[5].addEventListener('click', () => {
      console.clear();
    });

    errorBtns[6].addEventListener('click', () => {
      console.dir(document.querySelector('form'));
    });

    errorBtns[7].addEventListener('click', () => {
      console.dirxml(document.querySelector('main'));
    });

    errorBtns[8].addEventListener('click', () => {
      console.group('Demo group');
      console.log('Inside the group: line 1');
      console.log('Inside the group: line 2');
      console.groupCollapsed('Nested (collapsed) group');
      console.log('Nested log');
      console.groupEnd();
    });

    errorBtns[9].addEventListener('click', () => {
      console.log('Closing the outer group now');
      console.groupEnd();
    });

    errorBtns[10].addEventListener('click', () => {
      const people = [
        { name: 'Ada',   role: 'mathematician', year: 1815 },
        { name: 'Alan',  role: 'computer scientist', year: 1912 },
        { name: 'Grace', role: 'rear admiral', year: 1906 }
      ];
      console.table(people);
    });

    errorBtns[11].addEventListener('click', () => {
      console.time('demo-timer');
      console.log('Timer "demo-timer" started');
    });

    errorBtns[12].addEventListener('click', () => {
      console.timeEnd('demo-timer');
    });

    errorBtns[13].addEventListener('click', () => {
      function inner() {
        console.trace('Console Trace demo — printing call stack');
      }
      function outer() {
        inner();
      }
      outer();
    });

    errorBtns[14].addEventListener('click', () => {
      nonExistentFunction();
    });
  </script>
</body>

</html>
